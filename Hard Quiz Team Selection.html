<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hard Quiz Team Selection</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { font-family: 'Inter', system-ui, sans-serif; background-color: #000; color: #fff; }
  .font-playfair { font-family: 'Playfair Display', Georgia, serif; }
  textarea::-webkit-scrollbar { display: none; }
  textarea { -ms-overflow-style: none; scrollbar-width: none; }
  #settings-view, #selection-view { display: none; }
  #settings-view.active, #selection-view.active { display: flex; }
  .slot { height: 7rem; min-width: 0; overflow: hidden; }
  .slot.spinning .slot-name { opacity: .55; }
  @keyframes reveal { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .reveal { animation: reveal .45s cubic-bezier(.25,.46,.45,.94) forwards; }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #facc15; outline-offset: 2px; }
</style>
</head>
<body>

<!-- ============ Setup View ============ -->
<div id="settings-view" class="active min-h-screen w-full justify-center items-start p-4">
  <div class="bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-4xl border border-gray-700 my-8">
    <div class="text-center mb-8">
      <h1 class="font-playfair text-4xl text-yellow-400 mb-2">Hard Quiz Team Selection</h1>
      <p class="text-gray-400">Add your members, then pick two from each section.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
      <div class="space-y-6">
        <div>
          <label for="clubName" class="block text-sm font-medium text-gray-300 mb-2">1. Heading (first line)</label>
          <input type="text" id="clubName" value="HARD QUIZ" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
        </div>
        <div>
          <label for="logoFileInput" class="block text-sm font-medium text-gray-300 mb-2">2. Logo (optional)</label>
          <input type="file" id="logoFileInput" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-gray-600 file:text-white hover:file:bg-gray-500">
          <div class="flex items-center mt-2">
            <img id="logoPreview" src="" alt="Logo preview" class="h-12 w-auto max-w-[6rem] mr-4 hidden object-contain bg-white rounded-md p-1">
            <p id="logoFileStatus" class="text-xs text-green-400 h-4"></p>
          </div>
        </div>
        <div>
          <label for="shuffleSeconds" class="block text-sm font-medium text-gray-300 mb-2">3. Selection time (seconds)</label>
          <input type="number" id="shuffleSeconds" value="10" min="0" max="30" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
        </div>
        <div class="text-sm text-gray-400 bg-gray-900/60 border border-gray-700 rounded-lg p-4">
          <p class="font-semibold text-gray-300 mb-1">Members format</p>
          <p>One member per line: <span class="text-yellow-300">Name, Section</span></p>
          <p class="mt-1">Sections: Operations, Software, Finance, Admin.</p>
        </div>
      </div>

      <div class="flex flex-col space-y-4">
        <div class="flex-grow flex flex-col">
          <label for="membersList" class="block text-sm font-medium text-gray-300 mb-2">4. Paste members (Name, Section)</label>
          <textarea id="membersList" rows="10" class="w-full flex-grow bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white" placeholder="Jane Smith, Finance&#10;Raj Patel, Software"></textarea>
        </div>
        <div>
          <label for="membersFileInput" class="block text-sm font-medium text-gray-300 mb-2">Or upload a members file (.txt or .csv)</label>
          <input type="file" id="membersFileInput" accept=".txt,.csv" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-500 file:text-white hover:file:bg-blue-600">
          <p id="membersFileStatus" class="text-xs text-green-400 mt-1 min-h-4"></p>
        </div>
        <button id="sampleBtn" type="button" class="self-start text-sm text-gray-400 underline hover:text-yellow-300">Load default members</button>
      </div>
    </div>

    <p id="setupMessage" class="mt-6 text-sm text-center min-h-5" role="status"></p>
    <div class="mt-4 text-center">
      <button id="continueBtn" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold text-xl py-3 px-12 rounded-lg shadow-lg transition-transform hover:scale-105">Go to team selection</button>
    </div>
  </div>
</div>

<!-- ============ Selection View ============ -->
<div id="selection-view" class="relative min-h-screen w-full flex-col items-center p-4 sm:p-8">
  <header class="relative w-full max-w-6xl text-center mb-8 flex flex-col md:block">
    <img id="headerLogo" src="" alt="Logo" class="hidden object-contain h-24 md:h-[7.5rem] w-auto mb-4 md:mb-0 mx-auto md:mx-0 md:absolute md:top-0 md:left-0">
    <div class="md:px-56">
      <h1 id="headerClubName" class="font-playfair text-3xl sm:text-4xl lg:text-[2.6rem] leading-tight text-balance text-yellow-400"></h1>
      <p class="text-gray-300 text-xl sm:text-2xl mt-2">Hard Quiz Team Selection</p>
    </div>
  </header>

  <div class="flex flex-wrap justify-center gap-3 mb-8">
    <button id="selectAllBtn" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold text-lg py-3 px-8 rounded-lg shadow-lg transition-transform hover:scale-105">Select all teams</button>
    <button id="editMembersBtn" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-lg">Edit members</button>
  </div>

  <main id="sections" class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 gap-6"></main>
</div>

let members = [];          // {name, section}
let logoDataUrl = DEFAULT_LOGO;
let selections = {};       // section -> [names]
let history = {};         // section -> every name ever selected there (never repeated)
let busy = {};             // section -> bool

function switchView(v) {
  $('settings-view').classList.toggle('active', v === 'settings');
  $('selection-view').classList.toggle('active', v === 'selection');
  window.scrollTo(0, 0);
}

// ---------- Parsing ----------
function parseMembers(text) {
  const result = [], seen = new Set(), problems = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line) return;
    const m = line.match(/^(.*?)[\t,;|]\s*([^\t,;|]+)$/) || line.match(/^(.*\S)\s+-\s+(\S[^-]*)$/);
    if (!m) { problems.push(`Line ${i + 1}: needs "Name, Section"`); return; }
    const name = m[1].replace(/^\s*"|"\s*$/g, '').replace(/\s+/g, ' ').trim();
    const secRaw = m[2].trim().replace(/^"|"$/g, '');
    const section = ALIASES[secRaw.toLowerCase()];
    if (!name) { problems.push(`Line ${i + 1}: missing name`); return; }
    if (!section) {
      if (i === 0 && /^(name|member)/i.test(name)) return; // header row
      problems.push(`Line ${i + 1}: unknown section "${secRaw}"`); return;
    }
    const key = name.toLowerCase() + '|' + section;
    if (seen.has(key)) return;
    seen.add(key);
    result.push({ name, section });
  });
  return { result, problems };
}

// ---------- Selection ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pool(section) { return members.filter(m => m.section === section).map(m => m.name); }

function seen(section) { return history[section] || (history[section] = []); }
function freshNames(section) { const h = seen(section); return pool(section).filter(n => !h.includes(n)); }
function canSelectSection(section) {
  if (!pool(section).length) return false;
  if (!seen(section).length) return true;                 // first selection
  return freshNames(section).length >= PICKS_PER_SECTION; // reselect needs a full new pair
}

function spinDuration() {
  const seconds = Math.max(0, Math.min(30, parseFloat($('shuffleSeconds').value) || 0));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  return reduce ? 0 : seconds * 1000;
}

function runSelection(section) {
  if (busy[section] || !canSelectSection(section)) return Promise.resolve();
  const fresh = freshNames(section);
  const picks = shuffle(fresh).slice(0, PICKS_PER_SECTION);
  busy[section] = true;
  setSectionButtons(section);
  const slots = document.querySelectorAll(`[data-section="${section}"] .slot`);
  const duration = spinDuration();

  return new Promise(resolve => {
    const finish = () => {
      selections[section] = picks;
      picks.forEach(n => seen(section).push(n));
      busy[section] = false;
      renderSection(section, true);
      updateGlobalButtons();
      resolve();
    };
    if (duration === 0) return finish();
    slots.forEach(s => s.classList.add('spinning'));
    const timer = setInterval(() => {
      slots.forEach(s => { s.querySelector('.slot-name').textContent = fresh[Math.floor(Math.random() * fresh.length)]; });
    }, SHUFFLE_TICK_MS);
    setTimeout(() => { clearInterval(timer); finish(); }, duration);
  });
}

function reselectMember(section, index) {
  if (busy[section]) return;
  const current = selections[section] || [];
  if (!current[index]) return;
  const candidates = freshNames(section);   // anyone never selected before in this section
  if (!candidates.length) return;
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  busy[section] = true;
  setSectionButtons(section);
  const slot = document.querySelectorAll(`[data-section="${section}"] .slot`)[index];
  const duration = spinDuration();
  const finish = () => {
    const next = (selections[section] || []).slice();
    next[index] = pick;
    selections[section] = next;
    seen(section).push(pick);
    busy[section] = false;
    renderSection(section, index);
    updateGlobalButtons();
  };
  if (duration === 0) return finish();
  slot.classList.add('spinning');
  const timer = setInterval(() => {
    slot.querySelector('.slot-name').textContent = candidates[Math.floor(Math.random() * candidates.length)];
  }, SHUFFLE_TICK_MS);
  setTimeout(() => { clearInterval(timer); finish(); }, duration);
}

function selectAll() {
  SECTIONS.forEach(s => runSelection(s));
}

// ---------- Rendering ----------
function buildSections() {
  const main = $('sections');
  main.innerHTML = '';
  SECTIONS.forEach(section => {
    const card = document.createElement('section');
    card.dataset.section = section;
    card.className = 'bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-2xl flex flex-col';
    card.innerHTML = `
      <div class="flex items-baseline justify-between mb-4">
        <h2 class="font-playfair text-3xl text-yellow-400">${section}</h2>
        <p class="member-count text-sm text-gray-400"></p>
      </div>
      <div class="slots grid grid-cols-1 sm:grid-cols-2 gap-3 flex-grow"></div>
      <p class="note text-xs text-amber-300 mt-3 min-h-4"></p>
      <div class="mt-3">
        <button type="button" class="reselect-btn bg-blue-500 hover:bg-blue-600 disabled:opacity-40 disabled:hover:bg-blue-500 text-white font-semibold py-2 px-5 rounded-lg">Reselect</button>
      </div>`;
    card.querySelector('.reselect-btn').addEventListener('click', () => runSelection(section));
    main.appendChild(card);
    renderSection(section, false);
  });
}

function setSectionButtons(section) {
  const btn = document.querySelector(`[data-section="${section}"] .reselect-btn`);
  if (btn) btn.disabled = busy[section] || !canSelectSection(section);
  document.querySelectorAll(`[data-section="${section}"] .member-reselect`).forEach(b => { if (busy[section]) b.disabled = true; });
  updateGlobalButtons();
}
function updateGlobalButtons() {
  $('selectAllBtn').disabled = SECTIONS.some(s => busy[s]);
  $('selectAllBtn').classList.toggle('opacity-50', $('selectAllBtn').disabled);
}

function renderSection(section, animate) {
  const card = document.querySelector(`[data-section="${section}"]`);
  const count = pool(section).length;
  const picks = selections[section] || [];
  const freshCount = freshNames(section).length;
  const used = seen(section).length;
  card.querySelector('.member-count').textContent = `${count} member${count === 1 ? '' : 's'}` + (used ? `, ${freshCount} not yet selected` : '');
  const slotsEl = card.querySelector('.slots');
  slotsEl.innerHTML = '';
  for (let i = 0; i < PICKS_PER_SECTION; i++) {
    const name = picks[i];
    const slot = document.createElement('div');
    slot.className = 'slot flex flex-col items-center justify-center gap-3 text-center rounded-xl border px-3 py-4 ' +
      (name ? 'bg-gray-900 border-yellow-500/60' : 'bg-gray-900/50 border-gray-700 border-dashed');
    const p = document.createElement('p');
    p.className = 'slot-name w-full truncate text-lg sm:text-xl font-bold ' + (name ? 'text-white' + ((animate === true || animate === i) ? ' reveal' : '') : 'text-gray-500 text-base font-normal');
    p.textContent = name || (count ? 'Not selected yet' : 'No members');
    if (name) p.title = name;
    slot.appendChild(p);
    if (name) {
      const hasAlternative = freshNames(section).length > 0;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'member-reselect text-sm border border-yellow-500/70 text-yellow-300 hover:bg-yellow-500 hover:text-gray-900 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-yellow-300 font-semibold py-1 px-4 rounded-lg';
      b.textContent = 'Reselect';
      b.setAttribute('aria-label', `Reselect ${name}`);
      b.disabled = busy[section] || !hasAlternative;
      if (!hasAlternative) b.title = 'Everyone in this section has already been selected';
      b.addEventListener('click', () => reselectMember(section, i));
      slot.appendChild(b);
    }
    slotsEl.appendChild(slot);
  }
  const note = card.querySelector('.note');
  let msg = '';
  if (count === 0) msg = 'Add members to this section to select from it.';
  else if (count < PICKS_PER_SECTION) msg = `Only ${count} member${count === 1 ? '' : 's'} in this section, so fewer than ${PICKS_PER_SECTION} can be selected.`;
  else if (used && freshCount === 0) msg = 'Everyone in this section has been selected, so no more reselects are available.';
  else if (used && freshCount < PICKS_PER_SECTION) msg = `Only ${freshCount} member has not been selected yet, so only a single-name reselect is possible.`;
  note.textContent = msg;
  card.querySelector('.reselect-btn').disabled = busy[section] || !canSelectSection(section);
}

// ---------- Setup handlers ----------
function showSetupMessage(text, ok) {
  const el = $('setupMessage');
  el.textContent = text;
  el.className = 'mt-6 text-sm text-center min-h-5 ' + (ok ? 'text-green-400' : 'text-red-400');
}

$('membersFileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    membersListInput.value = ev.target.result;
    $('membersFileStatus').textContent = `Loaded ${file.name}`;
  };
  reader.readAsText(file);
});

$('logoFileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    logoDataUrl = ev.target.result;
    $('logoPreview').src = logoDataUrl;
    $('logoPreview').classList.remove('hidden');
    $('logoFileStatus').textContent = `Loaded ${file.name}`;
  };
  reader.readAsDataURL(file);
});

$('sampleBtn').addEventListener('click', () => {
  membersListInput.value = DEFAULT_MEMBERS;
  $('membersFileStatus').textContent = 'Default members loaded';
});

$('continueBtn').addEventListener('click', () => {
  const { result, problems } = parseMembers(membersListInput.value);
  if (!result.length) {
    showSetupMessage(problems.length ? problems.slice(0, 3).join(' · ') : 'Add at least one member as "Name, Section".', false);
    return;
  }
  members = result;
  selections = {}; busy = {}; history = {};
  const club = $('clubName').value.trim() || 'HARD QUIZ';
  $('headerClubName').textContent = club;
  document.title = `${club} Team Selection`;
  if (logoDataUrl) { $('headerLogo').src = logoDataUrl; $('headerLogo').classList.remove('hidden'); }
  else $('headerLogo').classList.add('hidden');
  buildSections();
  updateGlobalButtons();
  showSetupMessage(problems.length ? `${problems.length} line(s) skipped: ${problems.slice(0, 3).join(' · ')}` : '', false);
  switchView('selection');
});

membersListInput.value = DEFAULT_MEMBERS;
$('membersFileStatus').textContent = 'Default members loaded (Quiz_Team_Names.csv)';
$('logoPreview').src = DEFAULT_LOGO;
$('logoPreview').classList.remove('hidden');
$('logoFileStatus').textContent = 'Default logo in use';

$('selectAllBtn').addEventListener('click', selectAll);
$('editMembersBtn').addEventListener('click', () => switchView('settings'));
</script>
</body>
</html>
